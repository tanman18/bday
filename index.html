<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 44th Birthday, Dad!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0c0a09;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .bg-photo {
            background-image: url('6e42628a-9951-4ca2-86c2-dc4feb9ca8f2.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .glass-card {
            background: rgba(12, 10, 9, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .fade-in-up {
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(24px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex items-center justify-center p-6 md:p-12 overflow-hidden">

    <!-- Background Photo Layer with subtle dark gradient vignette -->
    <div class="fixed inset-0 bg-photo z-0"></div>
    <div class="fixed inset-0 bg-gradient-to-t from-black/80 via-black/30 to-black/60 z-0"></div>

    <!-- Minimalist Birthday Message Card -->
    <main class="relative z-10 w-full max-w-xl mx-auto text-center fade-in-up">
        <div class="glass-card rounded-3xl p-8 md:p-12 shadow-2xl space-y-6">
            
            <div class="space-y-2">
                <span class="inline-block text-xs font-medium tracking-[0.25em] text-amber-200/80 uppercase">
                    Celebrating Chapter 44
                </span>
                <h1 class="text-3xl md:text-5xl font-serif font-bold text-white tracking-tight leading-tight">
                    Happy 44th Birthday, Dad!
                </h1>
            </div>

            <div class="w-12 h-[1px] bg-amber-300/40 mx-auto my-4"></div>

            <p class="text-base md:text-lg text-slate-200 font-light leading-relaxed">
                Thank you for all the laughs, guidance and wonderful memories.
            </p>

            <p class="text-sm md:text-base text-amber-100/90 font-serif italic pt-2">
                Here's to another amazing year ahead together! ❤️
            </p>

        </div>
    </main>

</body>
</html>
